<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Risk Orchestrator · Рабочий стенд</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand"><span class="mark">◈</span> Risk Orchestrator</div>
      <nav id="nav" aria-label="Разделы"></nav>
      <div class="right">
        <span id="connection" class="online" role="status">Подключение…</span>
        <label class="role" for="role"><span>Роль</span>
          <select id="role" aria-label="Рабочая роль">
            <option value="admin">Администратор</option>
            <option value="analyst">Аналитик</option>
            <option value="reviewer">Риск-менеджер</option>
            <option value="director">Директор</option>
          </select>
        </label>
      </div>
    </header>
    <main class="content">
      <div class="head">
        <h1 id="heading">Системная панель</h1>
        <div class="tools">
          <button id="openDemos" hidden>Демо-сценарии</button>
          <select id="scenario" hidden aria-label="Сценарий для запуска"></select>
          <button id="demo" hidden>Запустить демо</button>
          <button id="launch" class="primary">＋ Запустить процесс</button>
        </div>
      </div>
      <div id="summary" class="metrics"></div>
      <label id="history" hidden>История демонстраций <select id="batch"></select></label>
      <section id="view" class="panel"></section>
    </main>
    <dialog id="formDialog">
      <form id="launchForm">
        <h2>Запустить процесс</h2>
        <div class="fields sp">
          <label>Процесс<select name="kind" required></select></label>
          <label
            >Бизнес-дата<input
              name="day"
              type="date"
              value="2026-11-22"
              required
          /></label>
          <label class="wide"
            >После завершения<select name="parent"></select
          ></label>
        </div>
        <div class="actions">
          <button type="button" data-close>Назад</button
          ><button class="primary">Запустить</button>
        </div>
      </form>
    </dialog>
    <dialog id="details">
      <div class="dialogtitle">
        <h2 id="jobTitle"></h2>
        <button data-close aria-label="Закрыть">×</button>
      </div>
      <div id="jobBody"></div>
      <div id="decision">
        <label
          >Комментарий (обязателен при отклонении)<textarea
            id="comment"
          ></textarea>
        </label>
        <div class="actions">
          <button data-decision="approve">Одобрить</button
          ><button data-decision="reject">Вернуть на перерасчёт</button>
        </div>
      </div>
    </dialog>
    <output id="toast" class="toast" aria-live="polite"></output>
    <script src="app.js?ui=timeline-time"></script>
  </body>
</html>
